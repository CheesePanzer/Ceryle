<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceryle Management</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --error-bg: #fdf0f0;
      --error-border: #f7bbbb;
      --error-text: #651616;
      --radius: 8px;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header Section */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logout-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--card-bg);
      transition: all 0.2s;
    }

    .logout-btn:hover {
      color: var(--danger);
      border-color: #fca5a5;
      background: #fef2f2;
    }

    /* Global Messages */
    .message {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      font-size: 0.925rem;
    }
    
    .error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      font-size: 0.925rem;
    }

    /* Cards Layout */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background-color: var(--primary);
      color: white;
    }

    button.primary:hover {
      background-color: var(--primary-hover);
    }

    button.danger {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
    }

    button.danger:hover {
      background-color: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    button.secondary {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border-color);
    }

    button.secondary:hover {
      background-color: #e2e8f0;
    }

    /* Template List Table-like UI */
    ul.template-list {
      list-style: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    ul.template-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      font-size: 0.925rem;
    }

    ul.template-list li:not(:last-child) {
      border-bottom: 1px solid var(--border-color);
    }

    ul.template-list li.empty-state {
      color: var(--text-muted);
      justify-content: center;
      padding: 24px;
      font-style: italic;
    }

    .inline-form {
      display: inline;
    }

    /* Upload Form UI */
    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }

    input[type="file"]:hover {
      border-color: var(--primary);
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      justify-content: flex-start;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>Ceryle Management</h2>
      <a href="/admin/logout" class="logout-btn">Logout</a>
    </header>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <section class="card">
      <h3>Templates</h3>
      <ul class="template-list">
        {% for t in templates %}
        <li>
          <span>{{ t }}</span>
          <form class="inline-form" method="post" action="/management/templates/{{ t }}/delete">
            <button type="submit" class="danger">Delete</button>
          </form>
        </li>
        {% else %}
        <li class="empty-state">No templates uploaded.</li>
        {% endfor %}
      </ul>
    </section>

    <section class="card">
      <h3>Upload Template</h3>
      <form method="post" action="/management/templates/upload" enctype="multipart/form-data">
        <div class="upload-group">
          <div class="file-input-wrapper">
            <input type="file" name="file" accept=".docx" required>
          </div>
          <div>
            <label class="checkbox-label">
              <input type="checkbox" name="overwrite" value="true">
              Overwrite if exists
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">Upload Template</button>
          </div>
        </div>
      </form>
    </section>

    <section class="card">
      <h3>Cache Management</h3>
      <form method="post" action="/management/cache/clear">
        <button type="submit" class="secondary">Clear all cache</button>
      </form>
    </section>
  </div>

</body>
</html>
